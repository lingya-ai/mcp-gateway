name: Build and publish Docker images

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPOSITORY: moailaozi/mcp-gateway

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25.0.2'
          distribution: graalvm-community
          cache: gradle
      - name: Run gateway tests
        run: >-
          sh gradlew test
          --tests '*GatewayCliTest'
          --tests '*GatewayBridgeTest'
          --tests '*SharedProcessRoutingTest'
          --tests '*GatewaySessionTest'
          --tests '*GatewayProcessTest'
          --tests '*GatewayHttpContractTest'
          --no-daemon --console=plain

  images:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          ref = os.environ["GITHUB_REF"]
          short_sha = os.environ["GITHUB_SHA"][:12]
          stable = False
          if ref.startswith("refs/tags/"):
              tag = ref.removeprefix("refs/tags/")
              if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9][A-Za-z0-9.-]*)?", tag):
                  raise SystemExit("Release tags must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease")
              version = tag[1:]
              stable = "-" not in version
          else:
              version = "sha-" + short_sha
          image = os.environ["IMAGE_REPOSITORY"]
          aliases = [version]
          if stable:
              aliases.append("latest")
          elif ref == "refs/heads/main":
              aliases.append("edge")
          targets = {}
          for variant in ("base", "node", "uv"):
              tags = [f"{image}:{alias}-{variant}" for alias in aliases]
              if variant == "base":
                  tags += [f"{image}:{alias}" for alias in aliases]
              targets[variant] = {"tags": tags, "args": {"VERSION": version}}
          Path("build").mkdir(exist_ok=True)
          Path("build/ci-bake.json").write_text(json.dumps({"target": targets}), encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY
      - name: Build native images for verification
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          files: |
            docker-bake.hcl
            build/ci-bake.json
          load: true
          set: |
            base.cache-from=type=gha,scope=mcp-gateway-base
            base.cache-to=type=gha,scope=mcp-gateway-base,mode=max
            node.cache-from=type=gha,scope=mcp-gateway-node
            node.cache-to=type=gha,scope=mcp-gateway-node,mode=max
            uv.cache-from=type=gha,scope=mcp-gateway-uv
            uv.cache-to=type=gha,scope=mcp-gateway-uv,mode=max
      - name: Verify native images
        env:
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          docker run --rm --entrypoint sh "$IMAGE_REPOSITORY:$VERSION-base" -c \
            'test "$(id -u)" != 0 && ! command -v java && /opt/mcp-gateway/mcp-gateway --version'
          docker run --rm --entrypoint node "$IMAGE_REPOSITORY:$VERSION-node" --version
          docker run --rm --entrypoint python \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts/native-smoke.py,target=/tmp/native-smoke.py,readonly" \
            "$IMAGE_REPOSITORY:$VERSION-uv" /tmp/native-smoke.py /opt/mcp-gateway/mcp-gateway
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Publish verified images
        if: github.event_name != 'pull_request'
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          files: |
            docker-bake.hcl
            build/ci-bake.json
          push: true
          provenance: mode=min
          sbom: true
